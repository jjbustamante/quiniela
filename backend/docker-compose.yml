services:
  postgres:
    image: postgres:16-alpine
    container_name: quiniela-postgres
    environment:
      POSTGRES_DB: quiniela
      POSTGRES_USER: quiniela
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - quiniela_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiniela -d quiniela"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  quiniela_pgdata:
