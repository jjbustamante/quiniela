# Backend CNB build config. Read by `pack build --descriptor backend/project.toml`.
# See brain/plugins/tech/spring-boot-cicd/packaging/cnb.md.

[_]
schema-version = "0.2"

[io.buildpacks]
builder = "heroku/builder:26"

# JVM 25 (LTS, GA Sept 2025). The Heroku/jvm CNB buildpack also reads
# system.properties for this; keep both in agreement.
[[io.buildpacks.env]]
name = "BP_JVM_VERSION"
value = "25"

# JRE (~120 MB) instead of full JDK (~300 MB) in the runtime image —
# we only run the app at runtime, never compile.
[[io.buildpacks.env]]
name = "BP_JVM_TYPE"
value = "JRE"

# Image build = `mvn package` only. Skip the things CI runs in separate
# parallel jobs (unit-tests, integration-tests, owasp-dc, spotless:check
# is bound to the compile phase). Cuts ~3-5 min off the image-build step.
[[io.buildpacks.env]]
name = "BP_MAVEN_BUILD_ARGUMENTS"
value = "-Dmaven.test.skip=true -Dspotless.check.skip=true -Ddependency-check.skip=true package"
