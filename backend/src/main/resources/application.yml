spring:
  application:
    name: quiniela-api

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/quiniela}
    username: ${JDBC_DATABASE_USERNAME:quiniela}
    password: ${JDBC_DATABASE_PASSWORD:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# Application config — see SecurityConfig, AuthController, GoogleTokenService, JwtService.
app:
  # Comma-separated emails granted is_admin=true on Google sign-in.
  # Tightening this list never demotes existing admins; only the DB does.
  admin-emails: ${ADMIN_EMAILS:}

  google:
    # OAuth 2.0 Client ID (the *.apps.googleusercontent.com value). Used as
    # the expected `aud` claim when verifying Google ID tokens. Set on the
    # Cloud Run service via IaC (env AUTH_GOOGLE_ID).
    oauth-client-id: ${AUTH_GOOGLE_ID:placeholder-for-local-dev.apps.googleusercontent.com}

  security:
    # HMAC HS256 signing key for the session JWTs we issue. MUST be ≥32 chars.
    # Same value Auth.js uses for its own session cookie signing (NEXTAUTH_SECRET).
    # Local dev gets a long throwaway placeholder; prod reads from Secret Manager.
    jwt-secret: ${NEXTAUTH_SECRET:dev-only-jwt-secret-must-be-at-least-32-chars-long}
