spring:
  application:
    name: quiniela-api

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/quiniela}
    username: ${JDBC_DATABASE_USERNAME:quiniela}
    password: ${JDBC_DATABASE_PASSWORD:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            temperature: 0.8
    # Enable Gemini chat model in prod via SPRING_AI_MODEL_CHAT=google-genai.
    # Tests disable it via src/test/resources/application.yml (model.chat=none)
    # because @ConditionalOnProperty(matchIfMissing=true) evaluates the property
    # before placeholder resolution stabilises in the autoconfigure phase.
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# Application config — see SecurityConfig, AuthController, GoogleTokenService, JwtService.
app:
  # Comma-separated emails granted is_admin=true on Google sign-in.
  # Tightening this list never demotes existing admins; only the DB does.
  admin-emails: ${ADMIN_EMAILS:}

  google:
    # OAuth 2.0 Client ID (the *.apps.googleusercontent.com value). Used as
    # the expected `aud` claim when verifying Google ID tokens. Set on the
    # Cloud Run service via IaC (env AUTH_GOOGLE_ID).
    oauth-client-id: ${AUTH_GOOGLE_ID:placeholder-for-local-dev.apps.googleusercontent.com}

  security:
    # HMAC HS256 signing key for the session JWTs we issue. MUST be ≥32 chars.
    # Same value Auth.js uses for its own session cookie signing (NEXTAUTH_SECRET).
    # Local dev gets a long throwaway placeholder; prod reads from Secret Manager.
    jwt-secret: ${NEXTAUTH_SECRET:dev-only-jwt-secret-must-be-at-least-32-chars-long}

  football-data:
    enabled: ${APP_FOOTBALL_DATA_ENABLED:false}     # default off; opt-in
    base-url: ${APP_FOOTBALL_DATA_BASE_URL:https://api.football-data.org/v4}
    api-key: ${APP_FOOTBALL_DATA_API_KEY:}          # required when enabled
    competition-code: ${APP_FOOTBALL_DATA_COMPETITION:WC}  # FIFA World Cup

  paul:
    provider: ${APP_PAUL_PROVIDER:google}
    project-id: ${APP_PAUL_PROJECT_ID:}
    location: ${APP_PAUL_LOCATION:us-central1}
    # Candidate models — one CANDIDATE prediction per match per model. Each entry is
    # either a bare model id (uses the default provider above) or "provider:modelId"
    # to route a specific vendor. Multi-vendor Vertex ensemble: Gemini via the genai
    # SDK; gpt-oss / Qwen via the Vertex OpenAI-compatible endpoint (global).
    # Override the whole list in prod via APP_PAUL_MODELS (comma-separated).
    models: ${APP_PAUL_MODELS:gemini-2.5-pro,gemini-2.5-flash}
    # Model used for the ensemble-judge synthesis of Paul's OFFICIAL bet.
    ensemble-model: ${APP_PAUL_ENSEMBLE_MODEL:gemini-2.5-pro}

  sync:
    token: ${APP_SYNC_TOKEN:}                       # shared secret; empty => /internal/** returns 401
    first-poll-offset-minutes: ${APP_SYNC_FIRST_POLL_OFFSET_MINUTES:0}
    poll-window-hours: ${APP_SYNC_POLL_WINDOW_HOURS:5}
    retry-interval-minutes: ${APP_SYNC_RETRY_INTERVAL_MINUTES:5}
    tasks:
      enabled: ${APP_SYNC_TASKS_ENABLED:false}
      queue: ${APP_SYNC_TASKS_QUEUE:}               # projects/<p>/locations/<l>/queues/results-sync
      target-base: ${APP_SYNC_TASKS_TARGET_BASE:}   # the api's own Cloud Run base URL
