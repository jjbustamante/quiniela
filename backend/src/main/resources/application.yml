spring:
  application:
    name: quiniela-api

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/quiniela}
    username: ${JDBC_DATABASE_USERNAME:quiniela}
    password: ${JDBC_DATABASE_PASSWORD:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
