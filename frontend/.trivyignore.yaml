# Trivy ignore file for the frontend container image.
#
# All entries MUST include an `expired_at` date. When the date passes,
# Trivy drops the suppression and CI re-fires — same discipline as the
# backend's OWASP DC .dependency-check-suppressions.xml.
#
# Re-evaluate on or before each expiration. If heroku/builder:26 has
# shipped a refresh by then, the CVE may have disappeared upstream.
#
# Last re-triaged 2026-06-25 against the live frontend image scan: the
# rsync/openssl Ubuntu-base CVEs and two Go ReverseProxy/html-template
# CVEs dropped out of the scan (builder fixed upstream) and were removed;
# the golang.org/x/net set below is new and was added.
#
# See brain/plugins/tech/nextjs-cicd/security/scanning.md.

vulnerabilities:

  # ─── Bundled in Next.js compiled output ────────────────────────────────
  # undici is NOT in our pnpm dependency graph (lockfile has only
  # undici-types); the flagged copy is vendored inside Next at
  # next/dist/compiled/undici, so a pnpm override can't touch it. On Node 24
  # Next uses native fetch, so the bundled undici is effectively unreachable
  # at runtime. Drops when Next ships a release whose bundled undici is
  # >= 6.27.0. Re-evaluate at expiry; bump Next if a patched release exists.

  - id: CVE-2026-12151
    statement: "undici DoS (unbounded memory) — vendored in next/dist/compiled/undici@6.25.0, not an app dep (not in pnpm graph). Node 24 uses native fetch so bundled undici is unreachable. Fixed in undici 6.27.0; waits on a Next.js bundle refresh."
    expired_at: 2026-07-21

  # ─── Buildpack tooling layer (heroku-buildpacks-nodejs internals) ──────
  # Reported against package.json copies of minimatch@9.0.5 / picomatch@4.0.3
  # / tar@7.5.2 that live in the buildpack's own /layers/ tooling, NOT our
  # app deps (our pnpm-lock.yaml has no tar and newer minimatch/picomatch).
  # Build-time only, never shipped in the runtime layer. Fixed when the next
  # heroku/buildpacks-nodejs release propagates into heroku/builder:26.

  - id: CVE-2026-26996
    statement: "minimatch DoS — in heroku/buildpacks-nodejs tooling, not our app deps."
    expired_at: 2026-07-23
  - id: CVE-2026-27903
