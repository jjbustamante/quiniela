  # ─── CNB lifecycle (/usr/bin/pebble) — bundled golang.org/x/net ────────
  # The pebble lifecycle binary statically links golang.org/x/net@v0.40.0.
  # These are HTML-parsing / idna / HTTP-2 DoS + privesc issues in that
  # module. pebble runs at BUILD time only and does not parse untrusted
  # HTML from our app; not reachable at runtime. Fixed when Heroku rebuilds
  # the lifecycle against golang.org/x/net >= 0.55.0.

  - id: CVE-2026-25680
    statement: "golang.org/x/net HTML parse CPU-exhaustion DoS — bundled in /usr/bin/pebble (CNB lifecycle, build-time only). Fixed in x/net 0.55.0; waits on builder refresh."
    expired_at: 2026-07-23
  - id: CVE-2026-25681
    statement: "golang.org/x/net HTML Render DoS — pebble lifecycle binary, build-time only."
    expired_at: 2026-07-23
  - id: CVE-2026-27136
    statement: "golang.org/x/net HTML Render DoS — pebble lifecycle binary, build-time only."
    expired_at: 2026-07-23
  - id: CVE-2026-39821
    statement: "golang.org/x/net/idna privilege escalation via incorrect Punycode label processing — pebble lifecycle binary, build-time only. Fixed in x/net 0.55.0."
    expired_at: 2026-07-23
  - id: CVE-2026-42502
    statement: "golang.org/x/net HTML Render DoS — pebble lifecycle binary, build-time only."
