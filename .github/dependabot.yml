# Dependabot config for the quiniela monorepo.
# Backend (Maven) + frontend (npm) + IaC (Terraform/OpenTofu) + GitHub Actions.
# See brain/plugins/tech/spring-boot-cicd/security/dependabot.md.

version: 2
updates:

  # Backend — Spring Boot / Maven
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Bogota"
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
      - automated
    commit-message:
      prefix: "chore(backend)"
      include: scope
    groups:
      spring-ecosystem:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
        update-types:
          - patch
          - minor
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "*-maven-plugin"
      minor-and-patch:
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.flywaydb:flyway-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.postgresql:postgresql"
        update-types: ["version-update:semver-major"]

  # Frontend — Next.js / npm
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Bogota"
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
      - automated
    commit-message:
      prefix: "chore(frontend)"
      include: scope
    groups:
      next-ecosystem:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-*"
          - "@types/react*"
        update-types:
          - patch
          - minor
      minor-and-patch:
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  # IaC — OpenTofu / Terraform
  - package-ecosystem: terraform
    directory: "/iac"
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - iac
      - automated
    commit-message:
      prefix: "chore(iac)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
      - automated
    commit-message:
      prefix: "chore(ci)"
