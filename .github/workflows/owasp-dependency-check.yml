# OWASP Dependency-Check — weekly source-level SCA for the backend (/backend).
#
# Why a separate, weekly, advisory workflow (split out of Backend CI):
#   NVD's API is flaky (503/520) and dependency-check-maven 12.x crashes hard
#   when it can't complete the feed update (`NoDataException: No documents
#   exist`). Run inline on every PR/push it dragged the Backend CI workflow
#   past ci-gate's 40-min wait and failed the gate — even though the job was
#   "advisory". Trivy's image scan in backend-ci.yml is the real PR-time CVE
#   gate (it scans the shipped image incl. Java deps); this is a complementary
#   second opinion on the declared Maven dependency graph.
#
# Behaviour:
#   - Weekly (+ manual). Never blocks anything.
#   - Files/updates a GitHub issue ONLY when the scan actually FINISHES and
#     finds vulnerable deps (CVSS >= 7, per failBuildOnCVSS in pom.xml).
#   - If NVD is down and no report is produced, it just warns on the run —
#     no issue, no noise.

name: OWASP Dependency-Check

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC (08:00 America/Bogota)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF upload to the Security tab
  issues: write            # file/update the findings issue

concurrency:
  group: owasp-dc
  cancel-in-progress: false

env:
  JAVA_VERSION: '25'

jobs:
  owasp-dc:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # NVD database is ~1.5 GB. PROGRESSIVE cache: the primary key embeds the
      # run id so it never hits exactly — restore always falls through to the
      # `…-v3-${os}-` prefix and picks the MOST RECENT cache. The save step
      # (if: always(), unique run-id key) then persists whatever NVD data this
      # run pulled, even a partial/interrupted download. So across runs the
      # dataset CONVERGES even when no single run finishes (NVD 503 days) —
      # DC resumes from the stored lastModified cursor next time. Bump the
      # `v3` suffix to force a full refresh after an OWASP DC major upgrade
      # (`v3` = DC 12). Old run-id caches are evicted LRU under the 10 GB cap.
      - name: Restore NVD data cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.dependency-check/data
          key: dependency-check-nvd-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-v3-${{ runner.os }}-

      - name: Run dependency-check (advisory, time-budgeted retry on NVD outage)
        id: dc
        working-directory: ./backend
        env:
          # Raises NVD rate limit 5/30s -> 50/30s (10x). Stored as BOTH an
          # Actions secret (this workflow) and a Dependabot secret.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set +e
          # Self-imposed budget kept under the job's timeout-minutes so an NVD
          # outage ends with a GRACEFUL green "no report" exit (no issue, no
          # noise) instead of a red timeout-cancel that skips the cache save.
          budget_end=$(( $(date +%s) + 90 * 60 ))
          attempt=0
          rc=1
          while :; do
            remaining=$(( budget_end - $(date +%s) ))
            if [ "${remaining}" -le 120 ]; then
              echo "completed=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=OWASP DC incomplete::NVD update did not finish within the time budget (likely 503/520). Partial NVD data cached for next run — no report, no issue."
              exit 0
            fi
            attempt=$((attempt+1))
            echo "::group::dependency-check attempt ${attempt} (budget ${remaining}s left)"
            # Cap each attempt at the remaining budget so one slow/hung NVD
            # download can't overshoot the job timeout; -k force-kills after grace.
            timeout -k 30 "${remaining}s" ./mvnw -B -ntp dependency-check:check ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}
            rc=$?
            echo "::endgroup::"
            # A produced report == the scan actually ran to completion.
            # (failBuildOnCVSS makes mvn exit non-zero on findings, but the
            #  report is still written; an NVD outage fails BEFORE the report.)
            if [ -f target/dependency-check-report.sarif ]; then
              break
            fi
            echo "::notice::No report yet (NVD outage / slow) — retrying after backoff"
            sleep 60
          done
          echo "completed=true" >> "$GITHUB_OUTPUT"
          if [ "${rc}" -ne 0 ]; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=OWASP DC findings::Backend dependencies with CVSS >= 7 found — filing an issue."
          else
            echo "findings=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OWASP Dependency-Check clean — no CVSS >= 7 findings."
          fi
          exit 0

      # Persist whatever NVD data we pulled (full or partial) so the next run
      # resumes from it. Unique run-id key => always saves; if: always() => runs
      # even if the dc step was cancelled/killed.
      - name: Save NVD data cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.dependency-check/data
          key: dependency-check-nvd-v3-${{ runner.os }}-${{ github.run_id }}

      - name: Upload SARIF to code scanning
        if: steps.dc.outputs.completed == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dc-backend

      - name: Upload HTML report artifact
        if: steps.dc.outputs.completed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

      - name: File / update findings issue
        if: steps.dc.outputs.completed == 'true' && steps.dc.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="owasp-dependency-check"
          TITLE="🔒 OWASP Dependency-Check: vulnerable backend dependencies"

          TABLE=$(jq -r '
            [.runs[].results[]
             | { cve: (.ruleId // "n/a"),
                 sev: (.level // "warning"),
                 dep: ((.locations[0].physicalLocation.artifactLocation.uri // "n/a")
                        | sub(".*/"; "")) }]
            | unique_by(.cve + .dep)
            | (["| CVE | Severity | Dependency |", "|---|---|---|"]
               + (sort_by(.cve) | map("| \(.cve) | \(.sev) | `\(.dep)` |")))
            | .[]
          ' backend/target/dependency-check-report.sarif)

          BODY=$(cat <<EOF
          The weekly [OWASP Dependency-Check run](${RUN_URL}) **completed** and found backend Maven dependencies with known vulnerabilities (CVSS ≥ 7, per \`failBuildOnCVSS\` in \`backend/pom.xml\`).

          ${TABLE}

          - 📄 Full HTML report: **dependency-check-report** artifact on [the run](${RUN_URL}).
          - 🔇 Accept/suppress false-positives in \`backend/.dependency-check-suppressions.xml\`.
          - ℹ️ Advisory only — Trivy gates the shipped image separately; nothing is blocked.

          _Auto-filed by the \`owasp-dependency-check\` workflow._
          EOF
          )

          gh label create "$LABEL" --color B60205 \
            --description "Weekly backend SCA findings (OWASP Dependency-Check)" 2>/dev/null || true

          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated existing issue #${EXISTING}."
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
