# Backend CI — Spring Boot service at backend/.
#
# Wave 1: build, test, scan locally (unit + integration + OWASP DC + Trivy).
# Wave 2: push to Artifact Registry via OIDC (WIF) + gcloud run deploy on
#         push to master. PRs build + scan only.
#
# Applies the personal CI/CD plugin at brain/plugins/tech/spring-boot-cicd/.

name: Backend CI

on:
  push:
    branches: [master, 'v*.x']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  IMAGE_NAME: quiniela-api
  # Builder + JVM version + Maven build args all live in backend/project.toml.

permissions:
  contents: read
  security-events: write   # for SARIF upload (Trivy + OWASP DC)

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Spotless check
        run: ./mvnw spotless:check
      - name: Unit tests
        run: ./mvnw test -T 1C

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Integration tests (Failsafe)
        run: ./mvnw verify -DskipUnitTests=true

  owasp-dc:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # Advisory only: NOT in build-scan-deploy's `needs`, so an NVD outage
    # (DC 11.x crashes hard when it can't fetch the feed) can't wedge a
    # deploy. continue-on-error keeps the overall run green so it doesn't
    # block backend PRs via the required ci-gate check. Trivy still scans
    # the deployed image (incl. Java deps), so the artifact stays CVE-gated.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # NVD database is ~1.5 GB and takes 10-15 min to download cold.
      # Cache it across all CI runs (no hashFiles in key). Bump the version
      # suffix (e.g. `v2`→`v3`) to force a full refresh after an OWASP DC
      # major upgrade — cache keys are immutable, so without a bump the new
      # DC version restores the old cache but never saves its own, leaving
      # every run to re-download the whole NVD DB. Bumped v2→v3 for DC 12.
      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@v5
        with:
          path: ~/.dependency-check/data
          key: dependency-check-nvd-v3-${{ runner.os }}

      - name: Run dependency-check
        working-directory: ./backend
        env:
          # Optional — register at https://nvd.nist.gov/developers/request-an-api-key
          # and save as repo secret. Raises NVD rate limit 5/30s → 50/30s (10×).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw dependency-check:check ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dc-backend

  # ─────────────────────────────────────────────────────────────────────────
  # Build the image once locally, scan it with Trivy, then on push to master
  # docker-push the SAME image and deploy. No double-build.
  #   - PRs / other branches: build + scan only (local image, no registry).
  #   - push to master: build + scan + push + deploy.
  # NOTE: commits merged by the Actions GITHUB_TOKEN (e.g. Dependabot
  # auto-merge) do NOT trigger a new run, so they don't auto-deploy. Push a
  # follow-up commit (or re-run a real push run at the right SHA) to ship them.
  # ─────────────────────────────────────────────────────────────────────────
  build-scan-deploy:
    needs: [unit-tests, integration-tests]   # owasp-dc is advisory (see above)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC token exchange (publish path only)
      security-events: write   # SARIF upload (Trivy)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - uses: buildpacks/github-actions/setup-pack@v5.12.4
        # Pin a specific tag — buildpacks/github-actions doesn't publish a floating v5 tag.

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0
          cache: true

      # GCP auth — only needed when we'll push (master). Skipped on PRs so they
      # don't require WIF setup just to validate.
      - uses: google-github-actions/auth@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image ref
        id: image
        # On master: registry-qualified ref so `docker push` knows the destination.
        # On PRs:    local-only ref scoped to this run.
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            REF="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          else
            REF="${{ env.IMAGE_NAME }}:ci-${SHORT_SHA}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: pack build (local — no --publish; we docker-push after Trivy gate)
        # --descriptor reads backend/project.toml (builder, BP_JVM_VERSION,
        # BP_JVM_TYPE=JRE, BP_MAVEN_BUILD_ARGUMENTS that skip tests +
        # Spotless + OWASP DC since CI ran them in separate jobs already).
        # No --volume mount: Paketo's non-root user model rejects the
        # docker-created /home/cnb/.m2 parent; pack's internal cache
        # layer covers single-run builds.
        run: |
          pack build "${{ steps.image.outputs.ref }}" \
            --descriptor backend/project.toml \
            --path backend/

      # The trivy-action wrapper silently drops `severity` and other inputs
      # on at least v0.36.0 (treats it like scan-all-severities), so we
      # install Trivy via setup-trivy and call the CLI directly. Stable,
      # debuggable, all flags reach Trivy verbatim.
      - name: Trivy image scan (one scan, table + sarif outputs)
        run: |
          IMAGE="${{ steps.image.outputs.ref }}"

          # One scan → JSON (no gate). Convert to table (for CI log
          # visibility) + sarif (for GH Security tab). Final --exit-code
          # gate uses the same JSON so a single scan covers all three.
          trivy image \
            --format json \
            --output trivy.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --ignorefile backend/.trivyignore.yaml \
            "$IMAGE"

          echo "::group::Trivy findings (Critical/High, fixed)"
          trivy convert --format table trivy.json
          echo "::endgroup::"

          trivy convert --format sarif --output trivy.sarif trivy.json

          # Gate on findings. --ignore-unfixed already filtered to fixed-available.
          COUNT=$(jq '[.Results[]?.Vulnerabilities? // []] | flatten | length' trivy.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Trivy found $COUNT Critical/High unfixed-in-this-image CVE(s). See table above + GH Security tab."
            exit 1
          fi

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-backend

      # Push the SAME image we just scanned. Only on master, only after Trivy passes.
      - name: docker push to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gcloud run deploy "${{ vars.GCP_BACKEND_SERVICE }}" \
            --image="${{ steps.image.outputs.ref }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

          URL=$(gcloud run services describe "${{ vars.GCP_BACKEND_SERVICE }}" \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "::notice::Backend deployed to ${URL}"
