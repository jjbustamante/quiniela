# Backend CI — Spring Boot service at backend/.
#
# Wave 1 (current): build, test, scan locally. No image push, no deploy.
# Wave 2 (deferred until quiniela.dpdns.org responds): add Artifact Registry
# push via OIDC and gcloud run deploy step.
#
# Applies the personal CI/CD plugin at brain/plugins/tech/spring-boot-cicd/.

name: Backend CI

on:
  push:
    branches: [main, 'v*.x']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  IMAGE_NAME: quiniela-api
  CNB_BUILDER: heroku/builder:26    # matches bin/deploy-backend.sh

permissions:
  contents: read
  security-events: write   # for SARIF upload (Trivy + OWASP DC)

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Spotless check
        run: ./mvnw spotless:check
      - name: Unit tests
        run: ./mvnw test -T 1C

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Integration tests (Failsafe)
        run: ./mvnw verify -DskipUnitTests=true

  owasp-dc:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Run dependency-check
        working-directory: ./backend
        run: ./mvnw dependency-check:check
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dc-backend

  build-and-scan-image:
    needs: [unit-tests, integration-tests, owasp-dc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - uses: buildpacks/github-actions/setup-pack@v5.12.3
        # Pin a specific tag — buildpacks/github-actions doesn't publish a floating v5 tag.

      - name: Compute image tag
        id: tag
        run: echo "tag=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: pack build (no publish — Wave 2 will push to Artifact Registry)
        run: |
          pack build "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" \
            --builder "${CNB_BUILDER}" \
            --path backend/ \
            --volume "${HOME}/.m2/repository:/home/cnb/.m2/repository:rw"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-backend
