# Backend CI — Spring Boot service at backend/.
#
# Wave 1 (current): build, test, scan locally. No image push, no deploy.
# Wave 2 (deferred until quiniela.dpdns.org responds): add Artifact Registry
# push via OIDC and gcloud run deploy step.
#
# Applies the personal CI/CD plugin at brain/plugins/tech/spring-boot-cicd/.

name: Backend CI

on:
  push:
    branches: [main, 'v*.x']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  IMAGE_NAME: quiniela-api
  # Builder + JVM version + Maven build args all live in backend/project.toml.

permissions:
  contents: read
  security-events: write   # for SARIF upload (Trivy + OWASP DC)

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Spotless check
        run: ./mvnw spotless:check
      - name: Unit tests
        run: ./mvnw test -T 1C

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Integration tests (Failsafe)
        run: ./mvnw verify -DskipUnitTests=true

  owasp-dc:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # NVD database is ~1.5 GB and takes 10-15 min to download cold.
      # Cache it across all CI runs (no hashFiles in key — bump `v1` to `v2`
      # to force a full refresh after an OWASP DC major version upgrade).
      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@v5
        with:
          path: ~/.dependency-check/data
          key: dependency-check-nvd-v1-${{ runner.os }}

      - name: Run dependency-check
        working-directory: ./backend
        env:
          # Optional — register at https://nvd.nist.gov/developers/request-an-api-key
          # and save as repo secret. Raises NVD rate limit 5/30s → 50/30s (10×).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw dependency-check:check ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dc-backend

  build-and-scan-image:
    needs: [unit-tests, integration-tests, owasp-dc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - uses: buildpacks/github-actions/setup-pack@v5.12.3
        # Pin a specific tag — buildpacks/github-actions doesn't publish a floating v5 tag.

      - name: Compute image tag
        id: tag
        run: echo "tag=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: pack build (no publish — Wave 2 will push to Artifact Registry)
        # --descriptor reads backend/project.toml (builder, BP_JVM_VERSION,
        # BP_JVM_TYPE=JRE, BP_MAVEN_BUILD_ARGUMENTS that skip tests +
        # Spotless + OWASP DC since CI ran them in separate jobs already).
        # No --volume mount: Paketo's non-root user model rejects the
        # docker-created /home/cnb/.m2 parent; pack's internal cache
        # layer covers single-run builds. (Cross-run caching via
        # --cache-image is a follow-up once OIDC push is wired.)
        run: |
          pack build "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" \
            --descriptor backend/project.toml \
            --path backend/

      # The trivy-action wrapper silently drops `severity` and other inputs
      # on at least v0.36.0 (treats it like scan-all-severities), so we
      # install Trivy via setup-trivy and call the CLI directly. Stable,
      # debuggable, all flags reach Trivy verbatim.
      - uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Trivy image scan (one scan, table + sarif outputs)
        run: |
          IMAGE="${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"

          # One scan → JSON (no gate). Convert to table (for CI log
          # visibility) + sarif (for GH Security tab). Final --exit-code
          # gate uses the same JSON so a single scan covers all three.
          trivy image \
            --format json \
            --output trivy.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            "$IMAGE"

          echo "::group::Trivy findings (Critical/High, fixed)"
          trivy convert --format table trivy.json
          echo "::endgroup::"

          trivy convert --format sarif --output trivy.sarif trivy.json

          # Gate on findings. --ignore-unfixed already filtered to fixed-available.
          COUNT=$(jq '[.Results[]?.Vulnerabilities? // []] | flatten | length' trivy.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Trivy found $COUNT Critical/High unfixed-in-this-image CVE(s). See table above + GH Security tab."
            exit 1
          fi

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-backend
