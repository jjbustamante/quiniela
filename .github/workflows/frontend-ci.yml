# Frontend CI — Next.js app at frontend/.
#
# Wave 1 (current): build, test, scan locally. No image push, no deploy.
# Wave 2 (deferred until quiniela.dpdns.org responds): add Artifact Registry
# push via OIDC and gcloud run deploy step.
#
# Applies the personal CI/CD plugin at brain/plugins/tech/nextjs-cicd/.
# Deviations from plugin defaults (intentional, documented in frontend/CLAUDE.md):
#   - Node 24 LTS (plugin defaults to Node 22; 24 is newer active LTS)
#   - no `output: 'standalone'` — Procfile launches via node directly

name: Frontend CI

on:
  push:
    branches: [main, 'v*.x']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: quiniela-web
  CNB_BUILDER: heroku/builder:26    # matches bin/deploy-frontend.sh

permissions:
  contents: read
  security-events: write   # for SARIF upload (Trivy)

jobs:

  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck

  unit-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:coverage

  e2e-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests (production server via webServer config)
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps, high severity)
        run: pnpm audit --prod --audit-level=high
      - name: Verify npm package signatures (Sigstore provenance)
        run: npm audit signatures

  build-and-scan-image:
    needs: [unit-tests, e2e-tests, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: buildpacks/github-actions/setup-pack@v5.12.3
        # Pin a specific tag — buildpacks/github-actions doesn't publish a floating v5 tag.

      - name: Compute image tag
        id: tag
        run: echo "tag=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: pack build (no publish — Wave 2 will push to Artifact Registry)
        run: |
          pack build "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" \
            --builder "${CNB_BUILDER}" \
            --path frontend/

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-frontend
