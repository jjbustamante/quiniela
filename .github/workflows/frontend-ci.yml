# Frontend CI — Next.js app at frontend/.
#
# Wave 1: build, test, scan locally (lint + typecheck + unit + e2e + npm audit + Trivy).
# Wave 2: push to Artifact Registry via OIDC (WIF) + gcloud run deploy on
#         push to master. PRs build + scan only.
#
# Applies the personal CI/CD plugin at brain/plugins/tech/nextjs-cicd/.
# Deviations from plugin defaults (intentional, documented in frontend/CLAUDE.md):
#   - Node 24 LTS (plugin defaults to Node 22; 24 is newer active LTS)
#   - no `output: 'standalone'` — Procfile launches via node directly

name: Frontend CI

on:
  push:
    branches: [master, 'v*.x']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: quiniela-web
  CNB_BUILDER: heroku/builder:26    # matches bin/deploy-frontend.sh — Paketo has no pnpm-install buildpack

permissions:
  contents: read
  security-events: write   # for SARIF upload (Trivy)

jobs:

  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck

  unit-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:coverage

  e2e-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests (production server via webServer config)
        # Auth.js refuses to load without a secret. Smoke tests don't sign in,
        # but the module is imported by every server-rendered page, so we
        # need a placeholder. NOT a real secret — the e2e job only renders
        # public unauthenticated pages.
        env:
          AUTH_SECRET: e2e-placeholder-not-a-real-secret-do-not-trust
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: ./frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps, high severity)
        run: pnpm audit --prod --audit-level=high
      - name: Verify npm package signatures (Sigstore provenance)
        run: npm audit signatures

  # ─────────────────────────────────────────────────────────────────────────
  # Build the image once locally, scan it with Trivy, then on push to master
  # docker-push the SAME image and deploy. No double-build.
  #   - PRs / other branches: build + scan only (local image, no registry).
  #   - push to master: build + scan + push + deploy.
  # ─────────────────────────────────────────────────────────────────────────
  build-scan-deploy:
    needs: [unit-tests, e2e-tests, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC token exchange (publish path only)
      security-events: write   # SARIF upload (Trivy)
    steps:
      - uses: actions/checkout@v6
      - uses: buildpacks/github-actions/setup-pack@v5.12.3
        # Pin a specific tag — buildpacks/github-actions doesn't publish a floating v5 tag.

      - uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0
          cache: true

      # GCP auth — only needed when we'll push (master). Skipped on PRs so they
      # don't require WIF setup just to validate.
      - uses: google-github-actions/auth@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image ref
        id: image
        # On master: registry-qualified ref so `docker push` knows the destination.
        # On PRs:    local-only ref scoped to this run.
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            REF="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          else
            REF="${{ env.IMAGE_NAME }}:ci-${SHORT_SHA}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: pack build (local — no --publish; we docker-push after Trivy gate)
        run: |
          pack build "${{ steps.image.outputs.ref }}" \
            --builder "${CNB_BUILDER}" \
            --path frontend/

      # The trivy-action wrapper silently drops `severity` and other inputs
      # on at least v0.36.0 (treats it like scan-all-severities), so we
      # install Trivy via setup-trivy and call the CLI directly. Stable,
      # debuggable, all flags reach Trivy verbatim.
      - name: Trivy image scan (one scan, table + sarif outputs)
        run: |
          IMAGE="${{ steps.image.outputs.ref }}"

          # One scan → JSON (no gate). Convert to table (for CI log
          # visibility) + sarif (for GH Security tab). Final --exit-code
          # gate uses the same JSON so a single scan covers all three.
          trivy image \
            --format json \
            --output trivy.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --ignorefile frontend/.trivyignore.yaml \
            "$IMAGE"

          echo "::group::Trivy findings (Critical/High, fixed)"
          trivy convert --format table trivy.json
          echo "::endgroup::"

          trivy convert --format sarif --output trivy.sarif trivy.json

          # Gate on findings. --ignore-unfixed already filtered to fixed-available.
          COUNT=$(jq '[.Results[]?.Vulnerabilities? // []] | flatten | length' trivy.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Trivy found $COUNT Critical/High unfixed-in-this-image CVE(s). See table above + GH Security tab."
            exit 1
          fi

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-frontend

      # Push the SAME image we just scanned. Only on master, only after Trivy passes.
      - name: docker push to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gcloud run deploy "${{ vars.GCP_WEB_SERVICE }}" \
            --image="${{ steps.image.outputs.ref }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

          URL=$(gcloud run services describe "${{ vars.GCP_WEB_SERVICE }}" \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "::notice::Frontend deployed to ${URL}"

          URL=$(gcloud run services describe "${{ vars.GCP_WEB_SERVICE }}" \
            --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "::notice::Frontend deployed to ${URL}"
